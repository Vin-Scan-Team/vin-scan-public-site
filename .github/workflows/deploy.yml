name: Deploy to Yandex Object Storage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up EditorConfig Checker
        uses: editorconfig-checker/action-editorconfig-checker@v3.0.0
        with:
          version: v4.0.2

      - name: Fix EditorConfig violations
        if: github.event_name == 'push'
        continue-on-error: true
        run: editorconfig-checker --fix

      - name: Commit EditorConfig fixes
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "style: apply EditorConfig fixes"
          branch: ${{ github.ref_name }}
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Check EditorConfig rules
        run: editorconfig-checker --format github-actions

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Verify build output
        run: test -f _site/index.html

      - name: Validate generated HTML
        run: npm run validate

      - name: Upload verified site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site/
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download verified site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Sync files to Yandex S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "ru-central1"
        run: |
          aws --endpoint-url=https://storage.yandexcloud.net s3 sync _site s3://vin-scan.ru/ \
            --cache-control "no-cache, must-revalidate" \
            --delete
